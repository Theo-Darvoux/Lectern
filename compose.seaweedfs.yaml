# Optional: run the self-hosted worker (HMAC-signed /file, /branding, /zip
# delivery) in dev. SeaweedFS itself is now part of the default dev stack
# (compose.override.yaml); this overlay only adds the worker, which the dev
# stack otherwise doesn't need (the API serves presigned S3 GETs directly when
# WORKER_ZIP_URL is empty).
#
# Bring it up with:
#   docker compose -f compose.yaml -f compose.override.yaml -f compose.seaweedfs.yaml up
#
# Then route deliveries through it by setting in .env:
#   WORKER_ZIP_URL=http://localhost:8788
#   WORKER_ZIP_HMAC_SECRET=<some-shared-secret>   # must match below
#
# In production, front this with nginx proxy_cache (infra/nginx/worker-cache.conf)
# to replace Cloudflare's edge cache.

services:
  selfhost-worker:
    restart: unless-stopped
    build:
      context: ./worker
      dockerfile: Dockerfile
    networks:
      - backend
      - frontend
    depends_on:
      seaweedfs-setup:
        condition: service_completed_successfully
    environment:
      PORT: "8788"
      WORKER_ZIP_HMAC_SECRET: ${WORKER_ZIP_HMAC_SECRET:-}
      S3_ENDPOINT: seaweedfs:8333
      S3_USE_SSL: "false"
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-lectern}
    ports:
      - "8788:8788"
