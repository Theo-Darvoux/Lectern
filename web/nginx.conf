server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    access_log off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Immutable static assets — cache forever
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Message bundles have no content hash in their URL so always revalidate.
    location /messages/ {
        add_header Cache-Control "no-cache";
    }

    # ──────────────────────────────────────────────────────────────────────
    # RSC payloads for client-rendered dynamic routes (static export).
    #
    # During a soft navigation Next.js fetches two kinds of RSC payload; each
    # must resolve to the matching text/plain file or the router falls back to a
    # full page reload (doMpaNavigation):
    #   • Full-page          <path>/index.txt          → the route's prerendered
    #                                                     shell index.txt
    #   • Per-segment (Next 16 segment cache)
    #                        <path>/__next.<seg>.txt    → the shell's segment file
    #                                                     of the same basename
    # Only the shell is prerendered (dynamic params collapse to "_" / the root),
    # and the payloads are param-independent, so deep paths reuse the shell files.
    #
    # These are top-level regex locations on purpose. Nesting them inside the
    # page locations is unreliable: where a regex location (…/preview/, …/edit)
    # overlaps a prefix location (/pull-requests/, /qcm/…), nested try_files fall
    # through to the wrong block. Regex locations are first-match-wins in file
    # order, so the most specific route must come first. `$uri` is tried first in
    # every block so genuinely prerendered paths (e.g. /qcm/new) keep their own
    # payloads instead of the shell's.

    # PR preview — /pull-requests/<id>/preview/<op> (before PR detail)
    location ~ ^/pull-requests/[^/]+/preview/.+/(__next\.[^/]+\.txt)$ {
        try_files $uri /pull-requests/_/preview/0/$1 =404;
    }
    location ~ ^/pull-requests/[^/]+/preview/.*\.txt$ {
        try_files $uri /pull-requests/_/preview/0/index.txt;
    }

    # PR detail — /pull-requests/<id>
    location ~ ^/pull-requests/.+/(__next\.[^/]+\.txt)$ {
        try_files $uri /pull-requests/_/$1 =404;
    }
    location ~ ^/pull-requests/.*\.txt$ {
        try_files $uri /pull-requests/_/index.txt;
    }

    # QCM edit — /qcm/<id>/edit (before QCM detail)
    location ~ ^/qcm/[^/]+/edit/(__next\.[^/]+\.txt)$ {
        try_files $uri /qcm/_/edit/$1 =404;
    }
    location ~ ^/qcm/[^/]+/edit/.*\.txt$ {
        try_files $uri /qcm/_/edit/index.txt;
    }

    # QCM detail — /qcm/<id>
    location ~ ^/qcm/[^/]+/(__next\.[^/]+\.txt)$ {
        try_files $uri /qcm/_/$1 =404;
    }
    location ~ ^/qcm/[^/]+/.*\.txt$ {
        try_files $uri /qcm/_/index.txt;
    }

    # Profile — /profile/<id>
    location ~ ^/profile/.+/(__next\.[^/]+\.txt)$ {
        try_files $uri /profile/_/$1 =404;
    }
    location ~ ^/profile/.*\.txt$ {
        try_files $uri /profile/_/index.txt;
    }

    # Browse — /browse/<...path>
    location ~ ^/browse/.+/(__next\.[^/]+\.txt)$ {
        try_files $uri /browse/$1 =404;
    }
    location ~ ^/browse/.*\.txt$ {
        try_files $uri /browse/index.txt;
    }

    # ──────────────────────────────────────────────────────────────────────
    # HTML page shells for the same dynamic routes (non-.txt requests). The
    # RSC regex locations above already claimed every *.txt request, so these
    # only ever see document/asset requests. Regex locations (preview, edit)
    # must precede their overlapping prefix locations.
    # ──────────────────────────────────────────────────────────────────────

    location ~ ^/pull-requests/[^/]+/preview/ {
        try_files $uri $uri/ $uri.html /pull-requests/_/preview/0/index.html;
    }
    location /pull-requests/ {
        try_files $uri $uri/ $uri.html /pull-requests/_/index.html;
    }

    location ~ ^/qcm/[^/]+/edit {
        try_files $uri $uri/ $uri.html /qcm/_/edit/index.html;
    }
    location ~ ^/qcm/[^/]+ {
        try_files $uri $uri/ $uri.html /qcm/_/index.html;
    }

    location /profile/ {
        try_files $uri $uri/ $uri.html /profile/_/index.html;
    }

    location /browse/ {
        try_files $uri $uri/ $uri.html /browse/index.html;
    }

    # SPA routing: try exact file, then .html version, then fallback to root index
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
