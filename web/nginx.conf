server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    access_log off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Immutable static assets — cache forever
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Message bundles have no content hash in their URL so always revalidate.
    location /messages/ {
        add_header Cache-Control "no-cache";
    }

    # Browse sub-paths: for RSC navigation the client fetches index.txt — serve the
    # pre-generated browse RSC payload as fallback so Next.js router gets text/plain
    # and can do a soft navigation instead of a hard reload (doMpaNavigation).
    location /browse/ {
        location ~* \.txt$ {
            try_files $uri /browse/index.txt;
        }
        try_files $uri $uri/ $uri.html /browse/index.html;
    }

    # Profile pages
    location /profile/ {
        location ~* \.txt$ {
            try_files $uri /profile/_/index.txt;
        }
        try_files $uri $uri/ $uri.html /profile/_/index.html;
    }

    # PR preview pages (must come before general pull-requests location)
    location ~ ^/pull-requests/[^/]+/preview/ {
        location ~* \.txt$ {
            try_files $uri /pull-requests/_/preview/0/index.txt;
        }
        try_files $uri $uri/ $uri.html /pull-requests/_/preview/0/index.html;
    }

    # PR detail pages
    location /pull-requests/ {
        location ~* \.txt$ {
            try_files $uri /pull-requests/_/index.txt;
        }
        try_files $uri $uri/ $uri.html /pull-requests/_/index.html;
    }

    # QCM edit pages
    location ~ ^/qcm/[^/]+/edit {
        location ~* \.txt$ {
            try_files $uri /qcm/_/edit/index.txt;
        }
        try_files $uri $uri/ $uri.html /qcm/_/edit/index.html;
    }

    # SPA routing: try exact file, then .html version, then fallback to root index
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
