name: Release

on:
  push:
    branches: [main]
    tags: ['alpha-*']

# Do not cancel a release after immutable component copies have started. A newer
# release queues behind the current one, preventing automated partial aliases.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/build.yml
