name: Release

on:
  push:
    branches: [main]
    tags: ['alpha-*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/build.yml
