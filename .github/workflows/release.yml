name: Release

on:
  push:
    branches: [main]
    tags: ['alpha-*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: ./api
            target: api
          - image: worker
            context: ./api
            target: worker
          - image: web
            context: ./web
            target: runner
          - image: selfhost-worker
            context: ./worker
            target: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          build-args: NEXT_PUBLIC_COMMIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/theo-darvoux/lectern/${{ matrix.image }}:sha-${{ github.sha }}
            ghcr.io/theo-darvoux/lectern/${{ matrix.image }}:${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
