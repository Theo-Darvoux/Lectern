name: Release

on:
  push:
    branches: [main]
    tags: ['alpha-*']

# Serialize every production release, including main/tag releases that may point
# at the same commit. This closes the race around immutable sha-<commit> tags.
# In-progress promotion is never cancelled; incomplete component tags remain
# non-deployable until the canonical release artifact exists.
concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/build.yml
