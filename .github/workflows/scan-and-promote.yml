name: Scan and Promote Manifest

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      candidate_ref:
        required: true
        type: string
      release_repository:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      alias_name:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate immutable component references
        shell: bash
        env:
          COMPONENT: ${{ inputs.component }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          RELEASE_REPOSITORY: ${{ inputs.release_repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ALIAS_NAME: ${{ inputs.alias_name }}
        run: |
          set -euo pipefail
          case "$COMPONENT" in
            api|worker|web|selfhost-worker) ;;
            *) echo "unsupported component: $COMPONENT" >&2; exit 64 ;;
          esac
          candidate_repository=${CANDIDATE_REF%@sha256:*}
          candidate_digest=${CANDIDATE_REF##*@sha256:}
          expected_candidate="ghcr.io/theo-darvoux/lectern/${COMPONENT}-candidate"
          expected_release="ghcr.io/theo-darvoux/lectern/${COMPONENT}-release"
          [[ "$candidate_repository" == "$expected_candidate" ]]
          [[ "$candidate_digest" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_REPOSITORY" == "$expected_release" ]]
          [[ "$RELEASE_TAG" =~ ^sha-[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" == "sha-${GITHUB_SHA}" ]]
          if [[ -n "$ALIAS_NAME" ]]; then
            [[ "$ALIAS_NAME" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
          fi

  scan:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: linux-amd64
          - platform: linux/arm64
            slug: linux-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      TRIVY_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan exact ${{ matrix.platform }} child image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.candidate_ref }}
          format: sarif
          output: trivy-${{ inputs.component }}-${{ matrix.slug }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Upload ${{ matrix.platform }} scan
        if: ${{ always() }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ inputs.component }}-${{ matrix.slug }}.sarif
          category: trivy-${{ inputs.component }}-${{ matrix.slug }}

  promote:
    needs: [validate, scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy the fully scanned manifest into the release repository
        shell: bash
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          RELEASE_REPOSITORY: ${{ inputs.release_repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ALIAS_NAME: ${{ inputs.alias_name }}
        run: |
          set -euo pipefail
          ./scripts/promote-release-image.sh \
            "$CANDIDATE_REF" \
            "$RELEASE_REPOSITORY" \
            "$RELEASE_TAG" \
            "$ALIAS_NAME"
