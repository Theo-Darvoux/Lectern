name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches-ignore: [main]
    tags-ignore: ['**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Install sandbox runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces for unconfined
          # applications. Hosted CI is ephemeral, so enable them for the real
          # Bubblewrap tests instead of silently accepting launcher failures.
          for key in \
            kernel.apparmor_restrict_unprivileged_userns \
            kernel.apparmor_restrict_unprivileged_unconfined; do
            if sysctl -n "$key" >/dev/null 2>&1; then
              sudo sysctl -w "$key=0"
            fi
          done
          bwrap --version
      - run: uv sync --frozen --extra dev
      - name: Smoke-test real sandbox runtime
        run: |
          uv run python - <<'PY'
          from app.core.security.sandbox import sandboxed_run

          result = sandboxed_run(["python3", "-c", "print('sandbox-ok')"], timeout=10)
          assert result.returncode == 0, result.stderr.decode(errors="replace")
          assert result.stdout == b"sandbox-ok\n"
          PY
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run mypy app/
      - name: Unit and hermetic tests
        run: uv run pytest -m "not integration"

  postgres-revert:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: docker.io/library/postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: lectern
          POSTGRES_PASSWORD: lectern
          POSTGRES_DB: lectern_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lectern -d lectern_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://lectern:lectern@127.0.0.1:5432/lectern_test
      REVERT_TEST_DATABASE_URL: postgresql+asyncpg://lectern:lectern@127.0.0.1:5432/lectern_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - working-directory: api
        run: uv sync --frozen --extra dev
      - name: Apply every database migration
        working-directory: api
        run: uv run alembic upgrade head
      - name: Exercise the real PostgreSQL revert serialization invariant
        working-directory: api
        run: uv run pytest -m integration tests/integration/database/test_revert_concurrency.py

  redis-auth-atomicity:
    runs-on: ubuntu-latest
    services:
      redis:
        image: docker.io/library/redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      AUTH_ATOMICITY_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - working-directory: api
        run: uv sync --frozen --extra dev
      - name: Prove authentication factors are atomically single-use in real Redis
        working-directory: api
        run: uv run pytest -m integration tests/integration/test_auth_redis_atomicity.py

  production-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - working-directory: api
        run: uv sync --frozen --extra dev
      - name: Release and deployment policy regressions
        working-directory: api
        run: >-
          uv run pytest
          tests/test_production_hardening_policy.py
          tests/test_production_release_manifest.py
          tests/test_release_gate_dependency_compat.py
          tests/test_release_hardening_regressions.py
          tests/test_release_promotion_script.py
          tests/test_release_supply_chain_hardening.py
          tests/test_release_runtime_gate_policy.py
          tests/test_storage_release_policy.py

  resolve-seaweedfs-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Load pinned release toolchain
        id: toolchain
        run: python3 scripts/export-release-toolchain.py --github-output "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: ${{ steps.toolchain.outputs.buildx_version }}
          driver-opts: |
            image=${{ steps.toolchain.outputs.buildkit_image }}
      - name: Resolve SeaweedFS to a canonical immutable digest
        id: resolve
        env:
          SEAWEEDFS_SOURCE_IMAGE: ${{ steps.toolchain.outputs.seaweedfs_test_image }}
        run: |
          set -euo pipefail
          resolved=$(./scripts/resolve-seaweedfs-image.sh "$SEAWEEDFS_SOURCE_IMAGE")
          echo "image=$resolved" >> "$GITHUB_OUTPUT"

  seaweedfs:
    needs: resolve-seaweedfs-image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SEAWEEDFS_IMAGE: ${{ needs.resolve-seaweedfs-image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - working-directory: api
        run: uv sync --frozen --extra dev
      - name: Run live SeaweedFS integration suite
        run: ./api/scripts/run-seaweedfs-integration-tests.sh

  seaweedfs-production-topology:
    needs: resolve-seaweedfs-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEAWEEDFS_IMAGE: ${{ needs.resolve-seaweedfs-image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - working-directory: api
        run: uv sync --frozen --extra dev
      - name: Run production-topology SeaweedFS integration suite
        run: ./api/scripts/run-seaweedfs-topology-tests.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm tsc --noEmit
      - run: pnpm i18n:check
      - run: pnpm test

  delivery:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck:node

  required:
    if: ${{ always() }}
    needs:
      - api
      - postgres-revert
      - redis-auth-atomicity
      - production-policy
      - seaweedfs
      - seaweedfs-production-topology
      - web
      - delivery
    runs-on: ubuntu-latest
    env:
      API_RESULT: ${{ needs.api.result }}
      POSTGRES_RESULT: ${{ needs.postgres-revert.result }}
      REDIS_AUTH_RESULT: ${{ needs.redis-auth-atomicity.result }}
      POLICY_RESULT: ${{ needs.production-policy.result }}
      SEAWEEDFS_RESULT: ${{ needs.seaweedfs.result }}
      SEAWEEDFS_TOPOLOGY_RESULT: ${{ needs.seaweedfs-production-topology.result }}
      WEB_RESULT: ${{ needs.web.result }}
      DELIVERY_RESULT: ${{ needs.delivery.result }}
    steps:
      - name: Require every premerge gate
        shell: bash
        run: |
          set -euo pipefail
          for result in \
            "$API_RESULT" \
            "$POSTGRES_RESULT" \
            "$REDIS_AUTH_RESULT" \
            "$POLICY_RESULT" \
            "$SEAWEEDFS_RESULT" \
            "$SEAWEEDFS_TOPOLOGY_RESULT" \
            "$WEB_RESULT" \
            "$DELIVERY_RESULT"; do
            [[ "$result" == success ]]
          done
