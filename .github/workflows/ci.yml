name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches-ignore: [main]
    tags-ignore: ['**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Install sandbox runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          bwrap --version
      - run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run mypy app/
      - name: Unit and hermetic tests
        run: uv run pytest -m "not integration"

  postgres-revert:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lectern
          POSTGRES_PASSWORD: lectern
          POSTGRES_DB: lectern_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lectern -d lectern_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://lectern:lectern@127.0.0.1:5432/lectern_test
      REVERT_TEST_DATABASE_URL: postgresql+asyncpg://lectern:lectern@127.0.0.1:5432/lectern_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - working-directory: api
        run: uv sync --frozen --extra dev
      - name: Apply every database migration
        working-directory: api
        run: uv run alembic upgrade head
      - name: Exercise the real PostgreSQL revert serialization invariant
        working-directory: api
        run: uv run pytest -m integration tests/integration/database/test_revert_concurrency.py

  production-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - working-directory: api
        run: uv sync --frozen --extra dev
      - name: Release and deployment policy regressions
        working-directory: api
        run: >-
          uv run pytest
          tests/test_production_hardening_policy.py
          tests/test_production_release_manifest.py
          tests/test_release_gate_dependency_compat.py
          tests/test_release_promotion_script.py
          tests/test_storage_release_policy.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm tsc --noEmit
      - run: pnpm i18n:check
      - run: pnpm test

  delivery:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck:node

  required:
    if: ${{ always() }}
    needs: [api, postgres-revert, production-policy, web, delivery]
    runs-on: ubuntu-latest
    env:
      API_RESULT: ${{ needs.api.result }}
      POSTGRES_RESULT: ${{ needs.postgres-revert.result }}
      POLICY_RESULT: ${{ needs.production-policy.result }}
      WEB_RESULT: ${{ needs.web.result }}
      DELIVERY_RESULT: ${{ needs.delivery.result }}
    steps:
      - name: Require every premerge gate
        shell: bash
        run: |
          set -euo pipefail
          for result in \
            "$API_RESULT" \
            "$POSTGRES_RESULT" \
            "$POLICY_RESULT" \
            "$WEB_RESULT" \
            "$DELIVERY_RESULT"; do
            [[ "$result" == success ]]
          done
