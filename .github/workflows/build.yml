name: Build and Push Images

on:
  push:
    branches: [main]
    tags: ['alpha-*']

# Cancel superseded runs on the same ref so rapid merges to main don't race to
# overwrite :latest. Tag builds (releases) are namespaced by their own ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  API_CANDIDATE_IMAGE: ghcr.io/theo-darvoux/lectern/api-candidate
  API_RELEASE_IMAGE: ghcr.io/theo-darvoux/lectern/api-release
  WORKER_CANDIDATE_IMAGE: ghcr.io/theo-darvoux/lectern/worker-candidate
  WORKER_RELEASE_IMAGE: ghcr.io/theo-darvoux/lectern/worker-release
  WEB_CANDIDATE_IMAGE: ghcr.io/theo-darvoux/lectern/web-candidate
  WEB_RELEASE_IMAGE: ghcr.io/theo-darvoux/lectern/web-release
  DELIVERY_CANDIDATE_IMAGE: ghcr.io/theo-darvoux/lectern/selfhost-worker-candidate
  DELIVERY_RELEASE_IMAGE: ghcr.io/theo-darvoux/lectern/selfhost-worker-release
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  # ── Detect which part of the monorepo changed ──────────────────────────────
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      delivery: ${{ steps.filter.outputs.delivery }}
      policy: ${{ steps.filter.outputs.policy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
            web:
              - 'web/**'
            delivery:
              - 'worker/**'
            policy:
              - '.github/workflows/build.yml'
              - '.env.example'
              - 'compose.yaml'
              - 'compose.prod.yaml'
              - 'scripts/promote-release-image.sh'
              - 'api/scripts/run-seaweedfs-topology-tests.sh'
              - 'api/tests/test_production_hardening_policy.py'
              - 'api/tests/test_release_promotion_script.py'

  # ── Test gates (must pass before the matching image is published) ──────────
  test-api:
    needs: [changes, test-production-policy, test-revert-postgres]
    if: ${{ needs.changes.outputs.api == 'true' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      # --extra dev pulls ruff/pytest/factory-boy from [project.optional-dependencies];
      # the default [dependency-groups] dev (mypy, aiosqlite, …) is installed too.
      - run: uv sync --frozen --extra dev
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Type-check (mypy)
        run: uv run mypy app/
      # Hermetic gate: exclude integration tests needing soffice/rsvg/S3 (see
      # the `integration` marker in pyproject.toml).
      - name: Tests (pytest, in-memory SQLite)
        run: uv run pytest -m "not integration"

  test-web:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint (eslint)
        run: pnpm lint
      - name: Type-check (tsc)
        run: pnpm tsc --noEmit
      - name: i18n key check
        run: pnpm i18n:check
      - name: Tests (vitest)
        run: pnpm test



  test-production-policy:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Install API test dependencies
        working-directory: api
        run: uv sync --frozen --extra dev
      - name: Production policy regressions
        working-directory: api
        run: uv run pytest tests/test_production_hardening_policy.py tests/test_release_promotion_script.py

  test-delivery:
    needs: changes
    if: ${{ needs.changes.outputs.delivery == 'true' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck:node

  test-revert-postgres:
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lectern
          POSTGRES_PASSWORD: lectern
          POSTGRES_DB: lectern_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lectern -d lectern_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://lectern:lectern@127.0.0.1:5432/lectern_test
      REVERT_TEST_DATABASE_URL: postgresql+asyncpg://lectern:lectern@127.0.0.1:5432/lectern_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - working-directory: api
        run: uv sync --frozen --extra dev
      - working-directory: api
        run: uv run alembic upgrade head
      - working-directory: api
        run: uv run pytest -m integration tests/integration/database/test_revert_concurrency.py

  # ── Live storage gates for publishable API/worker images ───────────────────
  resolve-seaweedfs-image:
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' || needs.changes.outputs.policy == 'true' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - name: Resolve tested SeaweedFS release to an immutable digest
        id: resolve
        env:
          SEAWEEDFS_SOURCE_IMAGE: chrislusf/seaweedfs:4.29
        run: |
          docker pull "$SEAWEEDFS_SOURCE_IMAGE"
          resolved=$(docker image inspect --format '{{index .RepoDigests 0}}' "$SEAWEEDFS_SOURCE_IMAGE")
          test -n "$resolved"
          echo "image=$resolved" >> "$GITHUB_OUTPUT"
          echo "Testing $resolved"

  test-seaweedfs:
    needs: [changes, resolve-seaweedfs-image]
    if: ${{ needs.changes.outputs.api == 'true' || needs.changes.outputs.policy == 'true' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      SEAWEEDFS_IMAGE: ${{ needs.resolve-seaweedfs-image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Install API dependencies
        working-directory: api
        run: uv sync --frozen --extra dev
      - name: Run live SeaweedFS integration suite
        run: ./api/scripts/run-seaweedfs-integration-tests.sh

  test-seaweedfs-topology:
    needs: [changes, resolve-seaweedfs-image]
    if: ${{ needs.changes.outputs.api == 'true' || needs.changes.outputs.policy == 'true' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SEAWEEDFS_IMAGE: ${{ needs.resolve-seaweedfs-image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Install API dependencies
        working-directory: api
        run: uv sync --frozen --extra dev
      - name: Run production-topology SeaweedFS integration suite
        run: ./api/scripts/run-seaweedfs-topology-tests.sh

  # ── Build & push API + Worker images (shared layers) ───────────────────────
  build-api:
    needs: [changes, test-api, test-seaweedfs, test-seaweedfs-topology]
    if: ${{ needs.changes.outputs.api == 'true' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (api candidate)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_CANDIDATE_IMAGE }}
          tags: |
            type=sha,format=long

      - name: Metadata (worker candidate)
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WORKER_CANDIDATE_IMAGE }}
          tags: |
            type=sha,format=long

      # Slim web-facing image (no document/media toolchain).
      - name: Build & push api candidate
        id: build-api-image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          target: api
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # Full-capability worker image (ghostscript, ffmpeg, libreoffice, …).
      # Reuses the builder + runtime-base layers from the api build via the gha
      # cache, so this build is mostly the extra apt layer.
      - name: Build & push worker candidate
        id: build-worker-image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          target: worker
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: |
            type=gha,scope=worker
            type=gha,scope=api
          cache-to: type=gha,scope=worker,mode=max

      # Candidates remain outside production repositories until their exact
      # multi-platform manifest digest passes the blocking scan.
      - name: Scan api candidate (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.API_CANDIDATE_IMAGE }}@${{ steps.build-api-image.outputs.digest }}
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Upload api scan
        if: ${{ always() }}
        continue-on-error: true # tolerate code scanning being disabled
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api

      - name: Scan worker candidate (Trivy)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.WORKER_CANDIDATE_IMAGE }}@${{ steps.build-worker-image.outputs.digest }}
          format: sarif
          output: trivy-worker.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Upload worker scan
        if: ${{ always() }}
        continue-on-error: true # tolerate code scanning being disabled
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-worker.sarif
          category: trivy-worker

      - name: Promote api and worker release images
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          alias_name="$GITHUB_REF_NAME"
          [[ "$GITHUB_REF" == "refs/heads/main" ]] && alias_name=latest
          ./scripts/promote-release-image.sh "${API_CANDIDATE_IMAGE}@${{ steps.build-api-image.outputs.digest }}" "${API_RELEASE_IMAGE}" "sha-${GITHUB_SHA}" "$alias_name"
          ./scripts/promote-release-image.sh "${WORKER_CANDIDATE_IMAGE}@${{ steps.build-worker-image.outputs.digest }}" "${WORKER_RELEASE_IMAGE}" "sha-${GITHUB_SHA}" "$alias_name"

  build-web:
    needs: [changes, test-web, test-production-policy]
    if: ${{ needs.changes.outputs.web == 'true' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (web candidate)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WEB_CANDIDATE_IMAGE }}
          tags: |
            type=sha,format=long

      - name: Build & push web candidate
        id: build-web-image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: |
            NEXT_PUBLIC_COMMIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Scan web candidate (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.WEB_CANDIDATE_IMAGE }}@${{ steps.build-web-image.outputs.digest }}
          format: sarif
          output: trivy-web.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Upload web scan
        if: ${{ always() }}
        continue-on-error: true # tolerate code scanning being disabled
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-web.sarif
          category: trivy-web

      - name: Promote web release image
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          alias_name="$GITHUB_REF_NAME"
          [[ "$GITHUB_REF" == "refs/heads/main" ]] && alias_name=latest
          ./scripts/promote-release-image.sh "${WEB_CANDIDATE_IMAGE}@${{ steps.build-web-image.outputs.digest }}" "${WEB_RELEASE_IMAGE}" "sha-${GITHUB_SHA}" "$alias_name"


  build-delivery:
    needs: [changes, test-delivery, test-production-policy]
    if: ${{ needs.changes.outputs.delivery == 'true' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build delivery candidate
        id: build-delivery-image
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ env.DELIVERY_CANDIDATE_IMAGE }}:sha-${{ github.sha }}
      - name: Scan delivery candidate (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.DELIVERY_CANDIDATE_IMAGE }}@${{ steps.build-delivery-image.outputs.digest }}
          format: sarif
          output: trivy-delivery.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Upload delivery scan
        if: ${{ always() }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-delivery.sarif
          category: trivy-delivery
      - name: Promote delivery release image
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          alias_name="$GITHUB_REF_NAME"
          [[ "$GITHUB_REF" == "refs/heads/main" ]] && alias_name=latest
          ./scripts/promote-release-image.sh "${DELIVERY_CANDIDATE_IMAGE}@${{ steps.build-delivery-image.outputs.digest }}" "${DELIVERY_RELEASE_IMAGE}" "sha-${GITHUB_SHA}" "$alias_name"
