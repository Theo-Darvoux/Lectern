name: Release Implementation

on:
  workflow_call:

# Concurrency is owned by release.yml; this reusable implementation must not
# share a concurrency group with (and cancel) its caller.
env:
  API_CANDIDATE_IMAGE: ghcr.io/theo-darvoux/lectern/api-candidate
  API_RELEASE_IMAGE: ghcr.io/theo-darvoux/lectern/api-release
  WORKER_CANDIDATE_IMAGE: ghcr.io/theo-darvoux/lectern/worker-candidate
  WORKER_RELEASE_IMAGE: ghcr.io/theo-darvoux/lectern/worker-release
  WEB_CANDIDATE_IMAGE: ghcr.io/theo-darvoux/lectern/web-candidate
  WEB_RELEASE_IMAGE: ghcr.io/theo-darvoux/lectern/web-release
  DELIVERY_CANDIDATE_IMAGE: ghcr.io/theo-darvoux/lectern/selfhost-worker-candidate
  DELIVERY_RELEASE_IMAGE: ghcr.io/theo-darvoux/lectern/selfhost-worker-release
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  # ── Detect which part of the monorepo changed ──────────────────────────────
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      delivery: ${{ steps.filter.outputs.delivery }}
      policy: ${{ steps.filter.outputs.policy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
            web:
              - 'web/**'
            delivery:
              - 'worker/**'
            policy:
              - '.github/workflows/build.yml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - '.github/workflows/scan-and-promote.yml'
              - '.env.example'
              - 'compose.yaml'
              - 'compose.prod.yaml'
              - 'deploy/production-images.env.example'
              - 'docs/production-release-manifest.md'
              - 'docs/ci-release-gates.md'
              - 'scripts/prepare-production-release.sh'
              - 'scripts/promote-release-image.sh'
              - 'scripts/write-production-release-manifest.py'
              - 'api/scripts/run-seaweedfs-topology-tests.sh'
              - 'api/tests/test_production_hardening_policy.py'
              - 'api/tests/test_production_release_manifest.py'
              - 'api/tests/test_release_gate_dependency_compat.py'
              - 'api/tests/test_release_promotion_script.py'
              - 'api/tests/test_storage_release_policy.py'

  # ── Live storage gates for publishable API/worker images ───────────────────
  resolve-seaweedfs-image:
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' || needs.changes.outputs.policy == 'true' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - name: Resolve tested SeaweedFS release to an immutable digest
        id: resolve
        env:
          SEAWEEDFS_SOURCE_IMAGE: chrislusf/seaweedfs:4.29
        run: |
          docker pull "$SEAWEEDFS_SOURCE_IMAGE"
          resolved=$(docker image inspect --format '{{index .RepoDigests 0}}' "$SEAWEEDFS_SOURCE_IMAGE")
          test -n "$resolved"
          echo "image=$resolved" >> "$GITHUB_OUTPUT"
          echo "Testing $resolved"

  test-seaweedfs:
    needs: [changes, resolve-seaweedfs-image]
    if: ${{ needs.changes.outputs.api == 'true' || needs.changes.outputs.policy == 'true' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      SEAWEEDFS_IMAGE: ${{ needs.resolve-seaweedfs-image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Install API dependencies
        working-directory: api
        run: uv sync --frozen --extra dev
      - name: Run live SeaweedFS integration suite
        run: ./api/scripts/run-seaweedfs-integration-tests.sh

  test-seaweedfs-topology:
    needs: [changes, resolve-seaweedfs-image]
    if: ${{ needs.changes.outputs.api == 'true' || needs.changes.outputs.policy == 'true' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SEAWEEDFS_IMAGE: ${{ needs.resolve-seaweedfs-image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Install API dependencies
        working-directory: api
        run: uv sync --frozen --extra dev
      - name: Run production-topology SeaweedFS integration suite
        run: ./api/scripts/run-seaweedfs-topology-tests.sh

  # ── Build & push API + Worker images (shared layers) ───────────────────────
  build-api:
    needs: [changes, test-seaweedfs, test-seaweedfs-topology]
    if: ${{ needs.changes.outputs.api == 'true' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    outputs:
      api_digest: ${{ steps.build-api-image.outputs.digest }}
      worker_digest: ${{ steps.build-worker-image.outputs.digest }}
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (api candidate)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_CANDIDATE_IMAGE }}
          tags: |
            type=sha,format=long

      - name: Metadata (worker candidate)
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WORKER_CANDIDATE_IMAGE }}
          tags: |
            type=sha,format=long

      # Slim web-facing image (no document/media toolchain).
      - name: Build & push api candidate
        id: build-api-image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          target: api
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # Full-capability worker image (ghostscript, ffmpeg, libreoffice, …).
      # Reuses the builder + runtime-base layers from the api build via the gha
      # cache, so this build is mostly the extra apt layer.
      - name: Build & push worker candidate
        id: build-worker-image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          target: worker
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: |
            type=gha,scope=worker
            type=gha,scope=api
          cache-to: type=gha,scope=worker,mode=max


  release-api:
    needs: build-api
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/scan-and-promote.yml
    with:
      component: api
      candidate_ref: ghcr.io/theo-darvoux/lectern/api-candidate@${{ needs.build-api.outputs.api_digest }}
      release_repository: ghcr.io/theo-darvoux/lectern/api-release
      release_tag: sha-${{ github.sha }}
      alias_name: ${{ github.ref == 'refs/heads/main' && 'latest' || github.ref_name }}

  release-worker:
    needs: build-api
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/scan-and-promote.yml
    with:
      component: worker
      candidate_ref: ghcr.io/theo-darvoux/lectern/worker-candidate@${{ needs.build-api.outputs.worker_digest }}
      release_repository: ghcr.io/theo-darvoux/lectern/worker-release
      release_tag: sha-${{ github.sha }}
      alias_name: ${{ github.ref == 'refs/heads/main' && 'latest' || github.ref_name }}

  build-web:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build-web-image.outputs.digest }}
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (web candidate)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WEB_CANDIDATE_IMAGE }}
          tags: |
            type=sha,format=long

      - name: Build & push web candidate
        id: build-web-image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: |
            NEXT_PUBLIC_COMMIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max


  release-web:
    needs: build-web
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/scan-and-promote.yml
    with:
      component: web
      candidate_ref: ghcr.io/theo-darvoux/lectern/web-candidate@${{ needs.build-web.outputs.digest }}
      release_repository: ghcr.io/theo-darvoux/lectern/web-release
      release_tag: sha-${{ github.sha }}
      alias_name: ${{ github.ref == 'refs/heads/main' && 'latest' || github.ref_name }}


  build-delivery:
    needs: changes
    if: ${{ needs.changes.outputs.delivery == 'true' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build-delivery-image.outputs.digest }}
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build delivery candidate
        id: build-delivery-image
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ env.DELIVERY_CANDIDATE_IMAGE }}:sha-${{ github.sha }}

  release-delivery:
    needs: build-delivery
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/scan-and-promote.yml
    with:
      component: selfhost-worker
      candidate_ref: ghcr.io/theo-darvoux/lectern/selfhost-worker-candidate@${{ needs.build-delivery.outputs.digest }}
      release_repository: ghcr.io/theo-darvoux/lectern/selfhost-worker-release
      release_tag: sha-${{ github.sha }}
      alias_name: ${{ github.ref == 'refs/heads/main' && 'latest' || github.ref_name }}
