name: SeaweedFS Integration

on:
  workflow_dispatch:
    inputs:
      seaweedfs_image:
        description: Optional non-authoritative SeaweedFS candidate tag or digest; blank uses the reviewed repository pin
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: seaweedfs-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-seaweedfs-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load pinned release toolchain
        id: toolchain
        run: python3 scripts/export-release-toolchain.py --github-output "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: ${{ steps.toolchain.outputs.buildx_version }}
          driver-opts: |
            image=${{ steps.toolchain.outputs.buildkit_image }}
      - name: Resolve SeaweedFS to an immutable digest
        id: resolve
        env:
          SEAWEEDFS_CANDIDATE_IMAGE: ${{ inputs.seaweedfs_image }}
          PINNED_SEAWEEDFS_IMAGE: ${{ steps.toolchain.outputs.seaweedfs_test_image }}
        run: |
          set -euo pipefail
          source_image="$SEAWEEDFS_CANDIDATE_IMAGE"
          [[ -n "$source_image" ]] || source_image="$PINNED_SEAWEEDFS_IMAGE"
          resolved=$(./scripts/resolve-seaweedfs-image.sh "$source_image")
          echo "image=$resolved" >> "$GITHUB_OUTPUT"

  seaweedfs:
    needs: resolve-seaweedfs-image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SEAWEEDFS_IMAGE: ${{ needs.resolve-seaweedfs-image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Install sandbox runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          for key in \
            kernel.apparmor_restrict_unprivileged_userns \
            kernel.apparmor_restrict_unprivileged_unconfined; do
            if sysctl -n "$key" >/dev/null 2>&1; then
              sudo sysctl -w "$key=0"
            fi
          done
      - name: Install API dependencies
        working-directory: api
        run: uv sync --frozen --extra dev
      - name: Run live SeaweedFS integration suite
        run: ./api/scripts/run-seaweedfs-integration-tests.sh

  seaweedfs-production-topology:
    needs: resolve-seaweedfs-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEAWEEDFS_IMAGE: ${{ needs.resolve-seaweedfs-image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Install API dependencies
        working-directory: api
        run: uv sync --frozen --extra dev
      - name: Run production-topology SeaweedFS integration suite
        run: ./api/scripts/run-seaweedfs-topology-tests.sh
