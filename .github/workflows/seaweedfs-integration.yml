name: SeaweedFS Integration

on:
  pull_request:
    paths:
      - ".github/workflows/seaweedfs-integration.yml"
      - ".github/workflows/build.yml"
      - ".github/workflows/ci.yml"
      - "api/app/config.py"
      - "api/app/core/events/processing.py"
      - "api/app/core/media/**"
      - "api/app/core/security/**"
      - "api/app/core/storage/**"
      - "api/app/routers/tus.py"
      - "api/app/routers/upload/**"
      - "api/app/schemas/material.py"
      - "api/app/workers/cleanup_uploads.py"
      - "api/app/workers/reconcile_multipart.py"
      - "api/app/workers/upload/**"
      - "api/pyproject.toml"
      - "api/uv.lock"
      - "api/scripts/run-seaweedfs-integration-tests.sh"
      - "api/scripts/run-seaweedfs-topology-tests.sh"
      - "api/tests/integration/storage/**"
      - "api/tests/test_storage_release_policy.py"
      - "api/tests/test_upload_lifecycle_race_hardening.py"
      - "compose.yaml"
      - "compose.prod.yaml"
      - "docs/r2-to-seaweedfs-migration.md"
      - "deploy/release-toolchain.env"
      - "infra/docker/seaweedfs/**"
      - "infra/docker/redis/redis.conf"
      - "scripts/export-release-toolchain.py"
      - "scripts/release_manifest_lib.py"
      - "scripts/resolve-seaweedfs-image.sh"
      - "web/src/lib/upload-client.ts"
  workflow_dispatch:
    inputs:
      seaweedfs_image:
        description: Optional non-authoritative SeaweedFS candidate tag or digest; blank uses the reviewed repository pin
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: seaweedfs-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-seaweedfs-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Load pinned release toolchain
        id: toolchain
        run: python3 scripts/export-release-toolchain.py --github-output "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: ${{ steps.toolchain.outputs.buildx_version }}
          driver-opts: |
            image=${{ steps.toolchain.outputs.buildkit_image }}
      - name: Resolve SeaweedFS to an immutable digest
        id: resolve
        env:
          SEAWEEDFS_CANDIDATE_IMAGE: ${{ inputs.seaweedfs_image }}
          PINNED_SEAWEEDFS_IMAGE: ${{ steps.toolchain.outputs.seaweedfs_test_image }}
        run: |
          set -euo pipefail
          source_image="$SEAWEEDFS_CANDIDATE_IMAGE"
          [[ -n "$source_image" ]] || source_image="$PINNED_SEAWEEDFS_IMAGE"
          resolved=$(./scripts/resolve-seaweedfs-image.sh "$source_image")
          echo "image=$resolved" >> "$GITHUB_OUTPUT"

  seaweedfs:
    needs: resolve-seaweedfs-image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SEAWEEDFS_IMAGE: ${{ needs.resolve-seaweedfs-image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Install API dependencies
        working-directory: api
        run: uv sync --frozen --extra dev
      - name: Run live SeaweedFS integration suite
        run: ./api/scripts/run-seaweedfs-integration-tests.sh

  seaweedfs-production-topology:
    needs: resolve-seaweedfs-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEAWEEDFS_IMAGE: ${{ needs.resolve-seaweedfs-image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Install API dependencies
        working-directory: api
        run: uv sync --frozen --extra dev
      - name: Run production-topology SeaweedFS integration suite
        run: ./api/scripts/run-seaweedfs-topology-tests.sh
