# nginx proxy_cache in front of the self-hosted worker.
#
# Replaces Cloudflare's `caches.default` edge cache for the off-Cloudflare
# deployment. The self-hosted worker (worker/src/node/server.ts) deliberately
# runs WITHOUT an in-process cache and relies on this layer instead.
#
# Usage: place the `proxy_cache_path` directive in the `http {}` block and the
# `location` blocks inside the public `server {}` that fronts the worker. The
# worker is reachable at http://selfhost-worker:8788 on the compose network.
#
# Why strip the query string from the cache key: the API rotates the signed
# `?token=` every ~12 min, but the bytes for a given object key never change.
# Keying on $uri alone lets every rotated URL share one cached entry — the same
# effect the Worker got by caching with the token stripped.

# ── http {} block ───────────────────────────────────────────────────────────
# proxy_cache_path /var/cache/nginx/worker levels=1:2 keys_zone=worker_cache:50m
#                  max_size=10g inactive=30d use_temp_path=off;

# ── server {} block ─────────────────────────────────────────────────────────

# Single-file serving — token-verified by the worker, cached here for 1 month.
location /file/ {
    proxy_pass http://selfhost-worker:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;

    proxy_cache worker_cache;
    proxy_cache_key "$uri";                 # ignore the rotating ?token=
    proxy_cache_valid 200 30d;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;
    proxy_ignore_headers Set-Cookie Cache-Control Expires;
    add_header X-Cache-Status $upstream_cache_status;
}

# Public branding assets — no token, cached for a day.
location /branding/ {
    proxy_pass http://selfhost-worker:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;

    proxy_cache worker_cache;
    proxy_cache_key "$uri";
    proxy_cache_valid 200 1d;
    proxy_ignore_headers Set-Cookie Cache-Control Expires;
    add_header X-Cache-Status $upstream_cache_status;
}

# Streaming ZIP — dynamic, token-specific, potentially huge: never cache.
location /zip {
    proxy_pass http://selfhost-worker:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;                    # stream straight through
    proxy_cache off;
}
