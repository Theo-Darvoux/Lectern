services:
  release-image-policy:
    image: alpine:3.20
    environment:
      API_IMAGE: ${API_IMAGE:?API_IMAGE must be set to an immutable GHCR digest}
      WORKER_IMAGE: ${WORKER_IMAGE:?WORKER_IMAGE must be set to an immutable GHCR digest}
      WEB_IMAGE: ${WEB_IMAGE:?WEB_IMAGE must be set to an immutable GHCR digest}
    command: >-
      /bin/sh -ec 'for value in "$$API_IMAGE" "$$WORKER_IMAGE" "$$WEB_IMAGE"; do
      case "$$value" in *@sha256:*) ;; *) echo "production images must use immutable @sha256 digests" >&2; exit 64 ;; esac;
      done'

  seaweedfs-image-policy:
    profiles: [ seaweedfs-prod ]
    image: alpine:3.20
    environment:
      SEAWEEDFS_IMAGE: ${SEAWEEDFS_IMAGE:-}
    command: >-
      /bin/sh -ec 'case "$$SEAWEEDFS_IMAGE" in
      *@sha256:*) exit 0 ;;
      *) echo "SEAWEEDFS_IMAGE must be pinned to an immutable @sha256 digest in production" >&2; exit 64 ;;
      esac'

  seaweedfs-master:
    depends_on:
      seaweedfs-image-policy:
        condition: service_completed_successfully

  api:
    image: ${API_IMAGE}
    command: gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 --timeout 60 --keep-alive 5 --max-requests 2000 --max-requests-jitter 200 --preload
    depends_on:
      release-image-policy:
        condition: service_completed_successfully

  worker:
    image: ${WORKER_IMAGE}
    depends_on:
      release-image-policy:
        condition: service_completed_successfully

  worker-fast:
    image: ${WORKER_IMAGE}
    depends_on:
      release-image-policy:
        condition: service_completed_successfully

  worker-slow:
    image: ${WORKER_IMAGE}
    depends_on:
      release-image-policy:
        condition: service_completed_successfully

  web:
    image: ${WEB_IMAGE}
    depends_on:
      release-image-policy:
        condition: service_completed_successfully
    # Use the production nginx static runner target
    build:
      target: runner
    # The runner image sets CMD ["nginx", "-g", "daemon off;"] by default, so we just reset the command
    # property here to null so it stops running the dev Next.js server override from compose.yaml
    command: []
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

  nginx:
    ports:
      # Expose on 9080 for production reverse proxy by default
      - "9080:80"
    volumes:
      # Use the production nginx conf template
      - ./infra/nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
