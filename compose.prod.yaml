services:
  postgres:
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  redis:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  meilisearch:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  api:
    image: ghcr.io/theo-darvoux/wikint/api:latest
    command: gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 --timeout 120
    environment:
      - ENVIRONMENT=production
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  worker:
    image: ghcr.io/theo-darvoux/wikint/api:latest
    command: arq app.workers.settings.WorkerSettings
    environment:
      - ENVIRONMENT=production
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  worker-fast:
    image: ghcr.io/theo-darvoux/wikint/api:latest
    command: arq app.workers.settings.UploadFastWorkerSettings
    environment:
      - ENVIRONMENT=production
      # Each replica runs WORKER_FAST_MAX_JOBS concurrent jobs (default 4).
      # Total fast-upload concurrency = WORKER_FAST_REPLICAS × WORKER_FAST_MAX_JOBS.
      - WORKER_FAST_MAX_JOBS=${WORKER_FAST_MAX_JOBS:-4}
    deploy:
      replicas: ${WORKER_FAST_REPLICAS:-2}
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  worker-slow:
    image: ghcr.io/theo-darvoux/wikint/api:latest
    command: arq app.workers.settings.UploadSlowWorkerSettings
    environment:
      - ENVIRONMENT=production
      # Each replica runs WORKER_SLOW_MAX_JOBS concurrent jobs (default 2).
      # Total slow-upload concurrency = WORKER_SLOW_REPLICAS × WORKER_SLOW_MAX_JOBS.
      - WORKER_SLOW_MAX_JOBS=${WORKER_SLOW_MAX_JOBS:-2}
    deploy:
      replicas: ${WORKER_SLOW_REPLICAS:-2}
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 256M

  web:
    image: ghcr.io/theo-darvoux/wikint/web:latest
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64M
        reservations:
          cpus: "0.1"
          memory: 32M

  nginx:
    ports:
      - "0.0.0.0:9080:80"
    environment:
      - S3_PUBLIC_DOMAIN=${S3_PUBLIC_DOMAIN:-files.wikint.hypnos2026.fr}
    command: >
      /bin/sh -c "envsubst '$$S3_PUBLIC_DOMAIN'
      < /etc/nginx/templates/nginx.conf.template
      > /tmp/nginx.conf
      && exec nginx -c /tmp/nginx.conf -g 'daemon off;'"
    volumes:
      - ./infra/nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./infra/nginx/nginx.onlyoffice.snippet:/etc/nginx/nginx.onlyoffice.snippet:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
