# Production overlay: docker compose -f compose.yaml -f compose.prod.yaml up -d
# Images are built and pushed to GHCR by .github/workflows/release.yml.
# IMAGE_TAG defaults to latest; pin a release with IMAGE_TAG=sha-<commit>.
services:
  api:
    image: ghcr.io/theo-darvoux/lectern/api:${IMAGE_TAG:-latest}
    build: !reset null
    environment:
      ENVIRONMENT: production
    command: gunicorn app.main:app -w 4 -k app.core.http.gunicorn_worker.RecyclingUvicornWorker -b 0.0.0.0:8000 --timeout 60 --keep-alive 5 --max-requests 2000 --max-requests-jitter 200 --preload

  worker:
    image: ghcr.io/theo-darvoux/lectern/worker:${IMAGE_TAG:-latest}
    build: !reset null
    environment:
      ENVIRONMENT: production

  worker-fast:
    image: ghcr.io/theo-darvoux/lectern/worker:${IMAGE_TAG:-latest}
    build: !reset null
    environment:
      ENVIRONMENT: production

  worker-slow:
    image: ghcr.io/theo-darvoux/lectern/worker:${IMAGE_TAG:-latest}
    build: !reset null
    environment:
      ENVIRONMENT: production

  web:
    image: ghcr.io/theo-darvoux/lectern/web:${IMAGE_TAG:-latest}
    build: !reset null
    # null restores the nginx runner image's inherited CMD. [] would clear it.
    command: null
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64M
        reservations:
          cpus: "0.1"
          memory: 32M

  selfhost-worker:
    image: ghcr.io/theo-darvoux/lectern/selfhost-worker:${IMAGE_TAG:-latest}
    build: !reset null
    environment:
      WORKER_ZIP_HMAC_SECRET: ${WORKER_ZIP_HMAC_SECRET:?WORKER_ZIP_HMAC_SECRET must be set}
      S3_ENDPOINT: ${SELFHOST_WORKER_S3_ENDPOINT:-seaweedfs-s3:8333}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set}

  nginx:
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      # Expose on 9080 for production reverse proxy by default
      - "9080:80"
    volumes:
      # Use the production nginx conf template
      - ./infra/nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
