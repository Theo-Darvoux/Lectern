services:
  postgres:
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  redis:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  meilisearch:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  api:
    image: ghcr.io/theo-darvoux/lectern/api:latest
    command: gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 --timeout 120
    env_file: .env
    environment:
      - ENVIRONMENT=production
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  worker:
    image: ghcr.io/theo-darvoux/lectern/worker:latest
    command: arq app.workers.settings.WorkerSettings
    env_file: .env
    environment:
      - ENVIRONMENT=production
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  worker-fast:
    image: ghcr.io/theo-darvoux/lectern/worker:latest
    command: arq app.workers.settings.UploadFastWorkerSettings
    env_file: .env
    environment:
      - ENVIRONMENT=production
      # Each replica runs WORKER_FAST_MAX_JOBS concurrent jobs (default 4).
      # Total fast-upload concurrency = WORKER_FAST_REPLICAS × WORKER_FAST_MAX_JOBS.
      - WORKER_FAST_MAX_JOBS=${WORKER_FAST_MAX_JOBS:-4}
    deploy:
      replicas: ${WORKER_FAST_REPLICAS:-2}
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  worker-slow:
    image: ghcr.io/theo-darvoux/lectern/worker:latest
    command: arq app.workers.settings.UploadSlowWorkerSettings
    env_file: .env
    environment:
      - ENVIRONMENT=production
      # Each replica runs WORKER_SLOW_MAX_JOBS concurrent jobs (default 2).
      # Total slow-upload concurrency = WORKER_SLOW_REPLICAS × WORKER_SLOW_MAX_JOBS.
      - WORKER_SLOW_MAX_JOBS=${WORKER_SLOW_MAX_JOBS:-2}
    deploy:
      replicas: ${WORKER_SLOW_REPLICAS:-2}
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 256M

  web:
    image: ghcr.io/theo-darvoux/lectern/web:latest
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64M
        reservations:
          cpus: "0.1"
          memory: 32M

  nginx:
    ports:
      - "0.0.0.0:9080:80"
    volumes:
      - ./infra/nginx/nginx.conf.template:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/nginx.eurooffice.snippet:/etc/nginx/nginx.eurooffice.snippet:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
