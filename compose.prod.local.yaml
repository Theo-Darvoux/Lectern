services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: api
    command: gunicorn app.main:app -w 4 -k app.core.http.gunicorn_worker.RecyclingUvicornWorker -b 0.0.0.0:8000 --timeout 60 --keep-alive 5 --max-requests 2000 --max-requests-jitter 200 --preload
    environment:
      ENVIRONMENT: production

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: worker
    environment:
      ENVIRONMENT: production

  worker-fast:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: worker
    environment:
      ENVIRONMENT: production

  worker-slow:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: worker
    environment:
      ENVIRONMENT: production

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    # null restores the runner image's CMD (node server.js). [] would clear it.
    command: null
    # The dev source mount and published port would shadow the built server
    # and expose it without nginx.
    volumes: !reset []
    ports: !reset []
    environment:
      NODE_OPTIONS: --max-old-space-size=384
      WATCHPACK_POLLING: "false"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  nginx:
    ports:
      - "9080:80"
    volumes:
      - ./infra/nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./infra/nginx/nginx.eurooffice.snippet:/etc/nginx/nginx.eurooffice.snippet:ro
      - ./infra/nginx/error-expired.html:/etc/nginx/html/error-expired.html:ro
