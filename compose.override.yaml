services:
  # SeaweedFS for local S3-compatible storage. Validated drop-in for MinIO
  # (Phase 0, docs/seaweedfs-migration-plan.md). Production can use the same
  # backend (STORAGE_BACKEND=seaweedfs) or Cloudflare R2 (STORAGE_BACKEND=r2).
  seaweedfs:
    restart: unless-stopped
    image: chrislusf/seaweedfs:latest
    networks:
      - backend
    command: >
      server -dir=/data -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=1024
      -s3 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - seaweedfs_data:/data
      - ./infra/docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "8333:8333" # S3 gateway
      - "8888:8888" # filer
      - "9333:9333" # master UI
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 256M

  seaweedfs-setup:
    image: amazon/aws-cli:latest
    networks:
      - backend
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: /bin/sh
    volumes:
      - ./infra/docker/seaweedfs/setup.sh:/setup.sh:ro
    command: /setup.sh
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-lectern}
      S3_REGION: ${S3_REGION:-us-east-1}

  api:
    networks:
      - default
    build:
      context: ./api
      dockerfile: Dockerfile
      target: api
    env_file:
      - .env
    depends_on:
      seaweedfs:
        condition: service_healthy
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    networks:
      - default
    build:
      context: ./api
      dockerfile: Dockerfile
      target: worker
    env_file:
      - .env
    command: ["arq", "app.workers.settings.WorkerSettings"]
    volumes:
      - ./api:/app

  worker-fast:
    networks:
      - default
    build:
      context: ./api
      dockerfile: Dockerfile
      target: worker
    env_file:
      - .env
    command: ["arq", "app.workers.settings.UploadFastWorkerSettings"]
    volumes:
      - ./api:/app

  worker-slow:
    networks:
      - default
    build:
      context: ./api
      dockerfile: Dockerfile
      target: worker
    env_file:
      - .env
    command: ["arq", "app.workers.settings.UploadSlowWorkerSettings"]
    volumes:
      - ./api:/app

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: deps
    command: sh -c "CI=true pnpm install && node_modules/.bin/next dev --turbopack"
    environment:
      # Route browser API calls through nginx (port 80) so SSE works correctly.
      # Next.js dev-server rewrites buffer streaming responses and break SSE.
      - NEXT_PUBLIC_API_URL=http://localhost/api
      # Internal API URL for SSR and rewrites
      - API_INTERNAL_URL=http://api:8000
      # EuroOffice Document Server URL (browser-facing, routed through nginx)
      - NEXT_PUBLIC_EUROOFFICE_URL=http://localhost/eurooffice
      # Source-repo URL for footer/About links (empty = links hidden)
      - NEXT_PUBLIC_REPO_URL=${NEXT_PUBLIC_REPO_URL:-}
      # Ensure Node.js has enough heap space for large page compilation
      - NODE_OPTIONS=--max-old-space-size=3584
      - WATCHPACK_POLLING=true
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  # Nginx handles CORS in Docker dev (strips backend headers, injects its own).
  # FastAPI's CORSMiddleware is authoritative in production and bare-uvicorn local dev.
  nginx:
    profiles: []
    networks:
      - default
    ports:
      - "80:80"
    environment:
      - CORS_ALLOWED_HEADERS=${CORS_ALLOWED_HEADERS:-Content-Type,Authorization,X-Client-ID,Accept,X-Requested-With}
    # Bypass the nginx entrypoint's envsubst which fails on read-only overlay filesystems.
    # Run envsubst manually into /tmp (always writable) and start nginx from there.
    # Pass '$$CORS_ALLOWED_HEADERS' explicitly so only that variable is substituted —
    # nginx variables like $host, $request_method, etc. are left intact.
    entrypoint: []
    command: >
      /bin/sh -c "envsubst '$$CORS_ALLOWED_HEADERS'
      < /etc/nginx/templates/nginx.conf.template
      > /tmp/nginx.conf
      && exec nginx -c /tmp/nginx.conf -g 'daemon off;'"
    volumes:
      - ./infra/nginx/nginx.dev.conf.template:/etc/nginx/templates/nginx.conf.template:ro

volumes:
  seaweedfs_data:
