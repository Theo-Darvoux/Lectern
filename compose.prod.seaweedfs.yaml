# compose.prod.seaweedfs.yaml
#
# Production-ready SeaweedFS deployment.
#
# Key differences from compose.override.yaml (dev):
#   • Three volume servers (replication=001: 2 copies on different nodes/disks)
#   • Filer + master are separate processes (not the all-in-one `server` command)
#   • s3.json is rendered from the template at deploy time (no hardcoded creds)
#   • Volumes are bind-mounted to host paths for easy backup / snapshot
#   • Resource limits are set for production workloads
#
# Usage:
#   envsubst < infra/docker/seaweedfs/s3.json.template > /opt/seaweedfs/s3.json
#   docker compose -f compose.yaml -f compose.prod.seaweedfs.yaml up -d

services:
  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    networks:
      - backend
    command: >
      master
      -ip=seaweedfs-master
      -ip.bind=0.0.0.0
      -port=9333
      -defaultReplication=001
      -volumeSizeLimitMB=1024
    volumes:
      - /opt/seaweedfs/master:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  seaweedfs-volume1:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      seaweedfs-master:
        condition: service_healthy
    command: >
      volume
      -dir=/data
      -ip.bind=0.0.0.0
      -mserver=seaweedfs-master:9333
      -port=8081
      -dataCenter=dc1
      -rack=rack1
    volumes:
      - /opt/seaweedfs/volume1:/data

  seaweedfs-volume2:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      seaweedfs-master:
        condition: service_healthy
    command: >
      volume
      -dir=/data
      -ip.bind=0.0.0.0
      -mserver=seaweedfs-master:9333
      -port=8082
      -dataCenter=dc1
      -rack=rack2
    volumes:
      - /opt/seaweedfs/volume2:/data

  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      seaweedfs-master:
        condition: service_healthy
    command: >
      filer
      -ip.bind=0.0.0.0
      -master=seaweedfs-master:9333
    volumes:
      - /opt/seaweedfs/filer:/data

  seaweedfs-s3:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      seaweedfs-filer:
        condition: service_started
    command: >
      s3
      -ip.bind=0.0.0.0
      -port=8333
      -filer=seaweedfs-filer:8888
      -config=/etc/seaweedfs/s3.json
    volumes:
      - /opt/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8333/ 2>&1 | grep -q '' && exit 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 512M

  # Override the api and worker services to use the production S3 endpoint.
  api:
    depends_on:
      seaweedfs-s3:
        condition: service_healthy

  selfhost-worker:
    # Self-hosted Node worker (replaces the Cloudflare Worker in prod).
    # Source: worker/src/node/server.ts
    image: ghcr.io/your-org/wikint-worker:latest
    restart: unless-stopped
    networks:
      - backend
      - default
    environment:
      PORT: "8788"
      WORKER_ZIP_HMAC_SECRET: ${WORKER_ZIP_HMAC_SECRET}
      S3_ENDPOINT: seaweedfs-s3:8333
      S3_USE_SSL: "false"
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-wikint}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8788/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
